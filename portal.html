<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCG AI Sales Control — Личный кабинет (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E8641F;
    --orange-light:#F2954F;
    --orange-deep:#B84C12;
    --gold:#B4913F;
    --gold-light:#D8BC7C;
    --ink:#1A1A1A;
    --ink-2:#262626;
    --graphite:#1A1A1A;
    --gray:#5C574F;
    --gray-light:#948E82;
    --peach:#F6E7D8;
    --white:#FFFFFF;
    --paper:#FBF8F2;
    --line:#EAE2D4;
    --good:#2E7D32;
    --good-bg:#E8F3E9;
    --bad:#C0392B;
    --bad-bg:#FBEAE8;
    --wait:#9C7A1E;
    --wait-bg:#FBF3DF;
    --shadow-card:0 1px 2px rgba(30,20,5,0.04), 0 8px 24px rgba(30,20,5,0.06);
    --shadow-card-lg:0 4px 10px rgba(30,20,5,0.05), 0 20px 44px rgba(30,20,5,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', Arial, Helvetica, sans-serif;
    background:var(--paper); color:var(--graphite);
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- LOGIN ---------- */
  #screen-login{padding:0;}
  #screen-login.active{display:block;}
  .login-split{display:grid; grid-template-columns:1fr 1fr; min-height:100vh;}
  .login-brand{
    position:relative; overflow:hidden;
    background:linear-gradient(155deg, var(--orange) 0%, var(--orange-deep) 100%);
    display:flex; align-items:center; justify-content:center; padding:60px;
  }
  .login-brand::after{
    content:''; position:absolute; right:-130px; bottom:-170px; width:420px; height:420px;
    border-radius:50%; border:56px solid rgba(255,255,255,0.08);
  }
  .login-brand-inner{max-width:340px; position:relative; z-index:1;}
  .login-brand-mark{width:28px; height:28px; color:#fff; margin-bottom:24px;}
  .login-brand-mark svg{width:100%; height:100%;}
  .login-brand-eyebrow{display:flex; align-items:center; gap:10px; color:rgba(255,255,255,0.88); font-size:12px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:20px;}
  .login-brand-eyebrow .dash{width:22px; height:1px; background:rgba(255,255,255,0.65); display:inline-block; flex-shrink:0;}
  .login-brand-word{font-family:'Manrope', sans-serif; font-weight:800; font-size:30px; line-height:1.22; color:#fff; letter-spacing:-0.01em;}
  .login-brand-quote{font-family:'Manrope', sans-serif; font-size:14.5px; line-height:1.6; color:rgba(255,255,255,0.85); margin-top:24px;}
  .login-form-side{display:flex; align-items:center; justify-content:center; background:var(--paper); padding:40px;}
  .login-card{
    background:transparent; padding:0;
    width:100%; max-width:360px;
  }
  .login-mark{width:34px; height:34px; color:var(--gold); margin-bottom:22px;}
  .login-mark svg{width:100%; height:100%;}
  .login-card h1{font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin-bottom:6px; letter-spacing:-0.01em;}
  .login-card .sub{font-size:13.5px; color:var(--gray); margin-bottom:32px;}
  .field{margin-bottom:16px;}
  .field label{font-size:12px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; display:block;}
  .field input{
    width:100%; padding:12px 14px; border:1px solid #E4DDD0; border-radius:9px;
    font-size:14.5px; font-family:inherit; color:var(--graphite); background:var(--white);
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(180,145,63,0.14);}
  .login-btn{
    width:100%; background:linear-gradient(165deg, var(--ink), #2b2b2b); color:#fff; border:none;
    padding:14px; border-radius:999px; font-size:14.5px; font-weight:700; margin-top:8px;
    letter-spacing:0.01em; box-shadow:0 6px 16px rgba(23,19,15,0.18); transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .login-btn:hover{background:linear-gradient(165deg, var(--orange), var(--orange-deep)); box-shadow:0 8px 20px rgba(232,100,31,0.3); transform:translateY(-1px);}
  .login-foot{font-size:12.5px; color:var(--gray-light); margin-top:22px;}
  @media (max-width:860px){
    .login-split{grid-template-columns:1fr;}
    .login-brand{padding:40px 32px; text-align:center;}
    .login-brand-inner{max-width:none; margin:0 auto;}
    .login-brand::after{display:none;}
    .login-form-side{padding:40px 24px;}
  }

  /* ---------- APP SHELL ---------- */
  .shell{display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 40px);}
  .sidebar{
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%); color:rgba(255,255,255,0.72);
    padding:28px 20px; display:flex; flex-direction:column;
  }
  .sb-logo{display:flex; align-items:center; gap:10px; padding:0 2px 22px; color:#fff; border-bottom:1px solid rgba(212,175,111,0.22); margin-bottom:22px;}
  .sb-logo .mk{width:20px; height:20px; color:var(--gold-light);}
  .sb-logo .mk svg{width:100%; height:100%;}
  .sb-logo .tx{font-family:'Fraunces', serif; font-weight:600; font-size:14px; letter-spacing:0.02em;}
  .sb-nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .sb-nav a{
    padding:10px 12px; border-radius:8px; font-size:13.5px; font-weight:600;
    color:rgba(255,255,255,0.5); display:flex; align-items:center; gap:10px;
    border-left:2px solid transparent; transition:background 0.15s ease, color 0.15s ease;
  }
  .sb-nav a.on{background:rgba(212,175,111,0.12); color:#fff; border-left:2px solid var(--gold-light);}
  .sb-nav a:hover{color:#fff;}
  .sb-foot{border-top:1px solid rgba(255,255,255,0.12); padding-top:14px; font-size:12.5px;}
  .sb-foot .nm{color:#fff; font-weight:700; margin-bottom:2px;}
  .sb-foot .br{color:rgba(255,255,255,0.4);}
  .sb-quick{display:none;}
  .sb-quick.filled{display:flex; flex-direction:row; gap:22px; padding-bottom:18px; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.1);}
  .sb-quick .qrow{display:block;}
  .sb-quick .qval{display:block; font-family:'Fraunces', serif; font-weight:600; font-size:21px; color:var(--gold-light); line-height:1.1;}
  .sb-quick .qlbl{display:block; font-size:11px; color:rgba(255,255,255,0.42); margin-top:3px; line-height:1.3;}

  .main{padding:34px 40px 64px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:14px;}
  .topbar h2{font-family:'Fraunces', serif; font-weight:600; font-size:26px; letter-spacing:-0.01em;}
  .week-select{
    display:flex; align-items:center; gap:10px;
    background:var(--white); border:1px solid var(--line); border-radius:999px; padding:9px 16px; font-size:13.5px; font-weight:700;
    box-shadow:var(--shadow-card);
  }
  .week-select .arrow{color:var(--gray-light); cursor:pointer; font-size:16px; font-weight:700; padding:6px 10px; border-radius:999px; display:inline-block; transition:background 0.15s ease, color 0.15s ease;}
  .week-select .arrow:hover{background:var(--peach); color:var(--orange);}

  .stat-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:32px;}
  .stat{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:22px 24px; box-shadow:var(--shadow-card);}
  .stat .lbl{font-size:12.5px; color:var(--gray); margin-bottom:10px;}
  .stat .val{font-family:'Fraunces', serif; font-size:30px; font-weight:600;}
  .stat .val small{font-family:'Manrope', sans-serif; font-size:13px; font-weight:500; color:var(--gray);}
  .stat.warn .val{color:var(--wait);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-head h3{font-family:'Fraunces', serif; font-weight:600; font-size:17px;}
  .section-head .cnt{font-size:12px; color:var(--orange-deep); background:var(--peach); padding:3px 10px; border-radius:20px; font-weight:700;}

  .list{background:var(--white); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:34px; box-shadow:var(--shadow-card);}
  .row{display:flex; align-items:center; gap:16px; padding:16px 22px; border-bottom:1px solid var(--line); cursor:pointer; transition:background 0.12s ease;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:#FDFBF6;}
  .row .who{flex:1; min-width:0;}
  .row .who .n{font-weight:700; font-size:14px;}
  .row .who .m{font-size:12.5px; color:var(--gray); margin-top:2px;}
  .pill{font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap;}
  .pill.wait{background:var(--wait-bg); color:var(--wait);}
  .pill.bad{background:var(--bad-bg); color:var(--bad);}
  .pill.good{background:var(--good-bg); color:var(--good);}
  .row .score{width:36px; text-align:right; font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--graphite);}
  .row .arrow-btn{color:var(--gray-light); font-size:14px;}

  .team-grid{display:grid;
